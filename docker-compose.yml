services:
  cra:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - cra-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      SIGNIN_URL: "{origin}/vnc/vnc.html?autoconnect=1&resize=scale"
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  cra-data:
